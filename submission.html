<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit a Question</title>

<!-- Google Fonts: a marker-style display face for headings, a clean rounded
     face for body text — gives the page a classroom-bulletin-board feel. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&family=EB+Garamond:ital,wght@1,600&display=swap" rel="stylesheet">

<!-- Supabase JS client, loaded from a CDN. This is the only "backend" the
     page has: it talks directly to your Supabase project over the internet. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  /* ===========================================================================
     THEME — "Curious Minds" notebook, shared across all four pages
     ---------------------------------------------------------------------------
     The competition is about celebrating GOOD QUESTIONS, so the look borrows
     from a Renaissance thinker's notebook rather than a generic classroom
     cork-board: warm aged-paper "pages", deep indigo ink-wash behind them
     (like a study lit at dusk), gold leaf for the special/celebratory bits,
     and a terracotta ink-wash red for the primary actions. A faint golden-
     spiral watermark (see body::before below, and the small icon by each
     page title) nods to the golden-ratio spiral Leonardo da Vinci used in
     his proportion studies — a quiet visual metaphor for "one good question
     spirals into the next."
     All four pages share these exact custom-property names, so re-theming
     later is just a matter of editing the values in this one block on each
     page (or better yet, moving this block into a single shared stylesheet).
  =========================================================================== */
  :root{
    --board:      #212B42;   /* deep indigo "ink & night sky" backdrop      */
    --board-line: #303F60;   /* soft glow worked into that backdrop         */
    --card:       #FBF3E0;   /* aged parchment page                         */
    --ink:        #2B241C;   /* warm sepia ink for body text                */
    --accent:     #C1502E;   /* terracotta ink-wash — primary actions       */
    --accent-dark:#9C3D22;
    --gold:       #D4AF37;   /* gold leaf — highlights, badges, icons       */
    --muted:      #8B7F68;   /* warm taupe for secondary text               */
    --error:      #B23A2E;
    --ok:         #4B7A52;   /* verdigris — aged bronze-green for success   */
    --line:       #E4D6AE;   /* hairline rule/border on parchment           */
  }
  *{ box-sizing: border-box; }

  /* Fixed golden-spiral watermark behind everything on the page — the
     golden-ratio spiral from da Vinci's proportion studies, echoing the
     "great questions" theme. Centered on the viewport (rather than tucked
     in a corner) with a thicker stroke (18 units on a ~2738-unit-wide
     viewBox) so it reads clearly as part of the page's background. Still
     sits behind content (z-index:0) and never intercepts clicks
     (pointer-events:none). */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:.15;

.2%2C683.0%20L1854.8%2C703.4%20L1851.8%2C724.4%20L1846.0%2C745.6%20L1837.2%2C766.7%20L1825.4%2C787.3%20L1810.5%2C807.1%20L1792.6%2C825.5%20L1771.8%2C842.1%20L1748.1%2C856.6%20L1721.8%2C868.4%20L1693.2%2C877.2%20L1662.5%2C882.5%20L1630.2%2C883.9%20L1596.7%2C881.3%20L1562.5%2C874.1%20L1528.1%2C862.3%20L1494.3%2C845.6%20L1461.5%2C824.1%20L1430.6%2C797.5%20L1402.1%2C766.2%20L1376.9%2C730.1%20L1355.5%2C689.7%20L1338.8%2C645.2%20L1327.3%2C597.1%20L1321.8%2C546.1%20L1322.7%2C492.7%20L1330.6%2C437.8%20L1345.9%2C382.2%20L1368.9%2C326.9%20L1399.8%2C272.9%20L1438.7%2C221.3%20L1485.6%2C173.1%20L1540.2%2C129.5%20L1602.2%2C91.6%20L1671.0%2C60.7%20L1746.0%2C37.7%20L1826.3%2C23.9%20L1910.9%2C20.0%20L1998.6%2C27.0%20L2088.2%2C45.7%20L2178.1%2C76.7%20L2266.7%2C120.3%20L2352.4%2C176.8%20L2433.5%2C246.2%20L2508.0%2C328.3%20L2574.1%2C422.7%20L2629.9%2C528.7%20L2673.8%2C645.2%20L2703.7%2C771.0%20L2718.3%2C904.6%20L2715.9%2C1044.3%20L2695.2%2C1188.0%20L2655.1%2C1333.5%20L2594.9%2C1478.2%20L2513.9%2C1619.7%20L2412.0%2C1754.9%20L2289.4%2C1881.1%20L2146.4%2C1995.3%20L1984.2%2C2094.3%20L1804.0%2C2175.3%20L1607.7%2C2235.4%20L1397.5%2C2271.7%20L1176.0%2C2281.8%20L946.3%2C2263.4%20L711.8%2C2214.5%20L476.5%2C2133.5%20L244.4%2C2019.3%20L20.0%2C1871.4%27%20fill%3D%27none%27%20stroke%3D%27%23D4AF37%27%20stroke-width%3D%2718%27%20stroke-linecap%3D%27round%27/%3E%3C/svg%3E");
    background-repeat:no-repeat;
    background-position: center;
    background-size: 640px 538px;
  }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 20%, var(--board-line) 0, transparent 45%),
      radial-gradient(circle at 80% 60%, var(--board-line) 0, transparent 40%),
      var(--board);
    font-family:'Nunito', sans-serif;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
  }
  /* position:relative + z-index:1 lifts the actual content above the fixed
     body::before spiral watermark (which sits at z-index:0). */
  .wrap{ width:100%; max-width: 480px; position:relative; z-index:1; }
  /* Groups the small spiral icon with the page title so they center as one
     unit; see the .spiral-icon rule below. */
  .eyebrow-row{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin: 0 0 4px;
  }
  .spiral-icon{ width:26px; height:26px; flex-shrink:0; opacity:.9; }
  h1.eyebrow{
    font-family:'Patrick Hand', cursive;
    color: var(--gold);
    text-align:center;
    font-size: 2rem;
    margin: 0;
    letter-spacing: .5px;
  }
  /* Italic serif tagline — a small nod to a handwritten note in the margin
     of an old notebook, set apart from the rounder, kid-friendly body font
     used everywhere else. */
  p.sub{
    font-family:'EB Garamond', serif;
    font-style: italic;
    text-align:center;
    color: #E7DFC7;   /* warm parchment-cream, tuned for the indigo backdrop */
    margin: 0 0 24px;
    font-weight:600;
    font-size: 1.05rem;
  }
  /* the "index card" itself: cream card, slight rotation, pin dot, soft shadow */
  .card{
    background: var(--card);
    border-radius: 6px;
    padding: 32px 28px;
    box-shadow: 0 18px 40px rgba(0,0,0,.35), 0 2px 0 rgba(0,0,0,.05) inset;
    transform: rotate(-0.6deg);
    position: relative;
  }
  /* A small gold-leaf "wax seal" dot pinning the note card in place —
     recolored from the original coral cork-board tack to match the new
     parchment/ink-leaf palette. */
  .pin{
    position:absolute; top:-10px; left:50%; transform: translateX(-50%);
    width:18px; height:18px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #f0d67a, var(--gold));
    box-shadow: 0 3px 6px rgba(0,0,0,.4);
  }
  label{
    display:block;
    font-weight: 800;
    font-size: .82rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color:#5c6b60;
    margin: 18px 0 6px;
  }
  label:first-of-type{ margin-top:0; }
  input[type=text], textarea{
    width:100%;
    font-family:'Nunito', sans-serif;
    font-size: 1rem;
    padding: 12px 14px;
    border: 2px solid #E3D9C2;
    border-radius: 8px;
    background:#fff;
    color: var(--ink);
    resize: vertical;
  }
  input[type=text]:focus, textarea:focus{
    outline: none;
    border-color: var(--accent);
  }
  .count{
    text-align:right;
    font-size:.78rem;
    color: var(--muted);
    margin-top:4px;
  }
  button{
    margin-top: 24px;
    width:100%;
    padding: 14px;
    font-family:'Nunito', sans-serif;
    font-size: 1.05rem;
    font-weight: 800;
    color:#fff;
    background: var(--accent);
    border:none;
    border-radius: 10px;
    cursor:pointer;
    transition: transform .08s ease, background .15s ease;
  }
  button:hover:not(:disabled){ background: var(--accent-dark); }
  button:active:not(:disabled){ transform: scale(.98); }
  button:disabled{ opacity:.6; cursor:not-allowed; }
  .msg{
    margin-top:16px;
    padding:12px 14px;
    border-radius:8px;
    font-weight:700;
    font-size:.92rem;
    display:none;
  }
  .msg.ok{ display:block; background:#E4F0E6; color: var(--ok); }
  .msg.error{ display:block; background:#FBE4E1; color: var(--error); }
</style>
</head>
<body>

<div class="wrap">
  <!-- Small golden-spiral icon beside the title — see the THEME comment in
       <style> for why a spiral. aria-hidden because it's purely decorative. -->
  <div class="eyebrow-row">
    <svg class="spiral-icon" viewBox="0 0 44 44" aria-hidden="true">
      <path d="M22.7,23.4 L22.8,23.5 L23.0,23.7 L23.1,23.9 L23.2,24.2 L23.2,24.4 L23.1,24.7 L23.0,25.0 L22.8,25.2 L22.6,25.5 L22.3,25.7 L21.9,25.8 L21.5,25.9 L21.1,25.9 L20.6,25.7 L20.2,25.5 L19.8,25.2 L19.4,24.7 L19.2,24.2 L19.0,23.6 L18.9,22.9 L19.1,22.2 L19.3,21.4 L19.8,20.7 L20.4,20.1 L21.2,19.6 L22.2,19.2 L23.2,19.1 L24.4,19.1 L25.6,19.4 L26.7,20.0 L27.8,20.9 L28.7,22.1 L29.5,23.5 L29.9,25.1 L30.0,26.9 L29.7,28.8 L29.0,30.7 L27.8,32.5 L26.1,34.2 L24.0,35.5 L21.6,36.5 L18.8,36.9 L15.8,36.8"
            fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1 class="eyebrow">Question Board</h1>
  </div>
  <p class="sub">Every great idea starts with a great question. What's yours?</p>
  <div class="msg" id="scriptError" style="max-width:480px; margin:0 auto 16px;"></div>

  <div class="card">
    <div class="pin"></div>

    <form id="submitForm">
      <label for="grade">Your grade</label>
      <select id="grade" style="width:100%; padding:12px 14px; border:2px solid #E3D9C2; border-radius:8px; font-family:'Nunito',sans-serif; font-size:1rem; background:#fff;">
        <option value="">Choose your grade…</option>
        <option value="3">3rd grade</option>
        <option value="4">4th grade</option>
        <option value="5">5th grade</option>
        <option value="6">6th grade</option>
      </select>

      <label for="studentId">Your Student ID</label>
      <input type="text" id="studentId" maxlength="30" placeholder="e.g. 123456" autocomplete="off">

      <label for="question">Your question</label>
      <textarea id="question" maxlength="200" rows="4" placeholder="Type your question here…"></textarea>
      <div class="count"><span id="charCount">0</span>/200</div>

      <button type="submit" id="submitBtn">Submit question</button>

      <div class="msg" id="msg"></div>
    </form>
  </div>
</div>

<script>
/* ============================================================================
 * CONFIG — EDIT THESE TWO LINES ONLY
 * Find them in your Supabase project: Project Settings -> API
 * ==========================================================================*/
const SUPABASE_URL = "https://mpdmxvqaryjvdxrajigy.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wZG14dnFhcnlqdmR4cmFqaWd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NDcyODksImV4cCI6MjEwMTIyMzI4OX0.3ZioZpF0hMMwbyiD30-MZ0PERxbO7U7kFokNWxSI2ko";
/* ==========================================================================*/

function showLoadError(message) {
  const el = document.getElementById('scriptError');
  el.className = 'msg error';
  el.textContent = message;
  console.error(message);
}

// Dynamically loads a <script> tag and resolves once it's actually loaded
// (or rejects if it fails), so we can wait for it before doing anything
// that depends on it.
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
}

// The <script> tag in <head> already tried loading the Supabase library
// from jsdelivr. If a network blocks that specific CDN (common on school
// filters), this tries unpkg as a second attempt before giving up.
async function ensureSupabaseLibrary() {
  if (window.supabase) return true;
  try {
    await loadScript('https://unpkg.com/@supabase/supabase-js@2');
  } catch (err) {
    console.error(err);
  }
  return !!window.supabase;
}

(async function main() {
  const loaded = await ensureSupabaseLibrary();
  if (!loaded) {
    showLoadError('Could not load the Supabase library from either CDN it tried (jsdelivr and unpkg). Check your internet connection, or whether your network blocks these domains — this page will not work until one of them loads.');
    return;
  }

const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form       = document.getElementById('submitForm');
const gradeEl     = document.getElementById('grade');
const idEl        = document.getElementById('studentId');
const questionEl  = document.getElementById('question');
const charCountEl = document.getElementById('charCount');
const submitBtn   = document.getElementById('submitBtn');
const msgEl       = document.getElementById('msg');

// Live character counter for the question box.
questionEl.addEventListener('input', () => {
  charCountEl.textContent = questionEl.value.length;
});

// Look up the visitor's public IP address. This has to happen client-side
// because these pages have no server of their own; ipify is a free, no-key
// service made for exactly this. If it fails for any reason we just store
// "unknown" rather than blocking the submission.
async function getIpAddress() {
  try {
    const res = await fetch('https://api.ipify.org?format=json');
    const data = await res.json();
    return data.ip;
  } catch (err) {
    return 'unknown';
  }
}

function showMessage(text, type) {
  msgEl.textContent = text;
  msgEl.className = 'msg ' + type;
}

/* --------------------------------------------------------------------
 * SUBMISSIONS OPEN/CLOSED
 * The teacher toggles this from admin.html (see the sidebar there); it's
 * stored in the database so it applies to every student's device, not
 * just this browser. fn_get_submissions_open() is a public RPC — no
 * passphrase needed to read it, since it's not sensitive, just a status.
 *
 * NOTE: this is a convenience for students, not a security boundary. A
 * closed form here just hides the button — it can't stop someone from
 * calling fn_submit_question directly. The real enforcement needs to live
 * server-side, inside fn_submit_question itself (see the comment in
 * schema-submissions-toggle.sql). If that server-side check hasn't been
 * added yet, treat this front-end gate as "soft" only.
 * ------------------------------------------------------------------*/
async function submissionsAreOpen() {
  const { data, error } = await dbClient.rpc('fn_get_submissions_open');
  if (error) {
    console.error('fn_get_submissions_open error:', error);
    // If we can't confirm the status, fail closed rather than open — a
    // student who can't submit for a minute is a much smaller problem
    // than accepting submissions the teacher meant to have blocked.
    return false;
  }
  return !!data;
}

// Disables every control in the form and shows an explanatory message.
// Used both for the initial "closed on page load" case and if the teacher
// closes submissions while a student already has this page open.
function showClosedState() {
  form.querySelectorAll('input, select, textarea, button').forEach(el => { el.disabled = true; });
  showMessage('Submissions are currently closed. Check back once your teacher opens them again.', 'error');
}

// Checked once up front so the form doesn't even look usable if
// submissions are already closed when the page loads.
if (!(await submissionsAreOpen())) {
  showClosedState();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msgEl.className = 'msg';

  const grade = gradeEl.value;
  const studentId = idEl.value.trim();
  const question = questionEl.value.trim();

  if (!grade) { showMessage('Please choose your grade.', 'error'); return; }
  if (!studentId) { showMessage('Please enter your Student ID.', 'error'); return; }
  if (!question) { showMessage('Please type a question.', 'error'); return; }

  // Re-check right before sending, in case the teacher closed submissions
  // after this page loaded but before the student hit Submit.
  if (!(await submissionsAreOpen())) {
    showClosedState();
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting…';

  const ip = await getIpAddress();

  // Calls the fn_submit_question database function (see schema.sql), which
  // validates the input server-side and stamps the row with a timestamp.
  const { error } = await dbClient.rpc('fn_submit_question', {
    p_grade: grade,
    p_student_id: studentId,
    p_question: question,
    p_ip: ip
  });

  submitBtn.disabled = false;
  submitBtn.textContent = 'Submit question';

  if (error) {
    showMessage(error.message || 'Something went wrong. Please try again.', 'error');
    return;
  }

  showMessage('Your question was added to the board!', 'ok');
  form.reset();
  charCountEl.textContent = '0';
});

})(); // end of main()
</script>

</body>
</html>
