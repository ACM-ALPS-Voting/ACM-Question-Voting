<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question Board</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&family=EB+Garamond:ital,wght@1,600&display=swap" rel="stylesheet">

<style>
  /* ===========================================================================
     THEME — "Curious Minds" notebook (see submission.html for the full
     rationale comment). These custom properties must stay in sync with the
     same block on the other four pages so the whole site reads as one
     product; if you retheme, edit the values here AND there (or better,
     move this block into one shared stylesheet).
  =========================================================================== */
  :root{
    --board:      #212B42;   /* deep indigo "ink & night sky" backdrop      */
    --board-line: #303F60;   /* soft glow worked into that backdrop         */
    --card:       #FBF3E0;   /* aged parchment page                         */
    --ink:        #2B241C;   /* warm sepia ink for body text                */
    --accent:     #C1502E;   /* terracotta ink-wash — primary actions       */
    --accent-dark:#9C3D22;
    --gold:       #D4AF37;   /* gold leaf — highlights, badges, icons       */
    --muted:      #8B7F68;   /* warm taupe for secondary text               */
    --error:      #B23A2E;
    --ok:         #4B7A52;   /* verdigris — aged bronze-green for success   */
    --line:       #E4D6AE;   /* hairline rule/border on parchment           */
  }
  *{ box-sizing:border-box; }

     "great questions" theme. Centered on the viewport with a thick stroke

     content (z-index:0) and never intercepts clicks (pointer-events:none).
     Identical on all five pages. */

    background-repeat:no-repeat;
    background-position: center;
    background-size: 640px 538px;
  }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 20%, var(--board-line) 0, transparent 45%),
      radial-gradient(circle at 80% 60%, var(--board-line) 0, transparent 40%),
      var(--board);
    font-family:'Nunito', sans-serif;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
  }
  /* position:relative + z-index:1 lifts the actual content above the fixed
     body::before spiral watermark (which sits at z-index:0). */
  .wrap{ width:100%; max-width: 440px; position:relative; z-index:1; }
  .eyebrow-row{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin: 0 0 4px;
  }
  .spiral-icon{ width:26px; height:26px; flex-shrink:0; opacity:.9; }
  h1.eyebrow{
    font-family:'Patrick Hand', cursive;
    color: var(--gold);
    text-align:center;
    font-size: 2rem;
    margin: 0;
    letter-spacing: .5px;
  }
  p.tagline{
    font-family:'EB Garamond', serif;
    font-style: italic;
    text-align:center;
    color: #E7DFC7;
    margin: 0 0 24px;
    font-weight:600;
    font-size: 1.05rem;
  }

  .card{
    background: var(--card);
    border-radius: 6px;
    padding: 32px 28px;
    box-shadow: 0 18px 40px rgba(0,0,0,.35), 0 2px 0 rgba(0,0,0,.05) inset;
    transform: rotate(-0.6deg);
    position: relative;
  }
  .pin{
    position:absolute; top:-10px; left:50%; transform: translateX(-50%);
    width:18px; height:18px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #f0d67a, var(--gold));
    box-shadow: 0 3px 6px rgba(0,0,0,.4);
  }
  label{
    display:block;
    font-weight: 800;
    font-size: .82rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color:#5c6b60;
    margin: 0 0 6px;
  }
  select{
    width:100%;
    font-family:'Nunito', sans-serif;
    font-size: 1rem;
    padding: 12px 14px;
    border: 2px solid var(--line);
    border-radius: 8px;
    background:#fff;
    color: var(--ink);
  }
  select:focus{ outline:none; border-color: var(--accent); }

  /* Both links are styled as full-width buttons so "Go vote" (the primary
     action) and "Submit a question" (secondary) read as two clear choices
     rather than one button plus a plain text link. */
  a.btn{
    display:block;
    margin-top: 20px;
    padding: 14px;
    font-family:'Nunito', sans-serif;
    font-size: 1.05rem;
    font-weight: 800;
    text-align:center;
    text-decoration:none;
    border-radius: 10px;
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
  }
  a.btn:active{ transform: scale(.98); }
  a.btn.primary{ color:#fff; background: var(--accent); }
  a.btn.primary:hover{ background: var(--accent-dark); }
  a.btn.secondary{
    color: var(--accent-dark);
    background: #fff;
    border: 2px solid var(--line);
  }
  a.btn.secondary:hover{ border-color: var(--accent); }

  .divider{
    display:flex; align-items:center; gap:10px;
    margin: 22px 0 2px;
    color: var(--muted); font-weight:800; font-size:.75rem;
    text-transform:uppercase; letter-spacing:.06em;
  }
  .divider::before, .divider::after{
    content:""; flex:1 1 auto; height:1px; background: var(--line);
  }
</style>
</head>
<body>

<div class="wrap">
  <!-- Small golden-spiral icon beside the title — see the THEME comment
       above for why a spiral. aria-hidden because it's purely decorative. -->
  <div class="eyebrow-row">
    <svg class="spiral-icon" viewBox="0 0 44 44" aria-hidden="true">
      <path d="M22.7,23.4 L22.8,23.5 L23.0,23.7 L23.1,23.9 L23.2,24.2 L23.2,24.4 L23.1,24.7 L23.0,25.0 L22.8,25.2 L22.6,25.5 L22.3,25.7 L21.9,25.8 L21.5,25.9 L21.1,25.9 L20.6,25.7 L20.2,25.5 L19.8,25.2 L19.4,24.7 L19.2,24.2 L19.0,23.6 L18.9,22.9 L19.1,22.2 L19.3,21.4 L19.8,20.7 L20.4,20.1 L21.2,19.6 L22.2,19.2 L23.2,19.1 L24.4,19.1 L25.6,19.4 L26.7,20.0 L27.8,20.9 L28.7,22.1 L29.5,23.5 L29.9,25.1 L30.0,26.9 L29.7,28.8 L29.0,30.7 L27.8,32.5 L26.1,34.2 L24.0,35.5 L21.6,36.5 L18.8,36.9 L15.8,36.8"
            fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1 class="eyebrow">Question Board</h1>
  </div>
  <p class="tagline">Where every great question begins.</p>

  <div class="card">
    <div class="pin"></div>

    <label for="gradeSelect">Choose your grade</label>
    <select id="gradeSelect">
      <option value="3">Grade 3</option>
      <option value="4">Grade 4</option>
      <option value="5">Grade 5</option>
      <option value="6">Grade 6</option>
      <option value="FINAL">Final Vote (all grades)</option>
    </select>

    <!-- href is filled in / kept up to date by the script below — this
         default value is just a sane placeholder in case JS hasn't run
         yet (e.g. the instant the page paints, or if a search engine
         crawls the raw HTML). -->
    <a class="btn primary" id="voteLink" href="voting.html?grade=3">Go vote →</a>

    <div class="divider">or</div>

    <a class="btn secondary" href="submission.html">Submit a question →</a>
  </div>
</div>

<script>
  // The only interactivity this page needs: keep the "Go vote" link's href
  // in sync with whatever grade is currently selected. No backend calls at
  // all here — voting.html and submission.html do the real work; this page
  // is just a friendly front door that points visitors at the right link.
  const gradeSelect = document.getElementById('gradeSelect');
  const voteLink = document.getElementById('voteLink');

  function updateVoteLink() {
    voteLink.href = `voting.html?grade=${encodeURIComponent(gradeSelect.value)}`;
  }

  gradeSelect.addEventListener('change', updateVoteLink);
  updateVoteLink(); // set the correct href immediately on load, not just after a change
</script>

</body>
</html>
