  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 20%, var(--board-line) 0, transparent 45%),
      radial-gradient(circle at 80% 60%, var(--board-line) 0, transparent 40%),

    color: var(--ink);

  /* position:relative + z-index:1 lifts the actual content above the fixed

  .eyebrow-row{ display:flex; align-items:center; justify-content:center; gap:10px; margin:0 0 4px; }
  .spiral-icon{ width:26px; height:26px; flex-shrink:0; opacity:.9; }
  h1.eyebrow{
    font-family:'Patrick Hand', cursive;
    color: var(--gold);
    text-align:center;
    font-size: 2rem;
    margin: 0;
  }
  /* NOTE: .sub's text content is set dynamically by JS (id="subline") to
     reflect live voting status, so only its styling changes here — the
     italic serif tagline below it is a separate, static element. */
  .sub{ text-align:center; color:#E7DFC7; font-weight:700; margin:0 0 6px; }
  .tagline{
    font-family:'EB Garamond', serif;
    font-style: italic;
    text-align:center;
    color:#E7DFC7;
    font-weight:600;
    font-size: 1.05rem;

    border-radius: 8px;

  /* Gold-leaf "wax seal" dot pinning the note card in place — matches the
     recolored .pin on the other three pages. */
  .pin{
    position:absolute; top:-10px; left:50%; transform: translateX(-50%);
    width:18px; height:18px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #f0d67a, var(--gold));
    box-shadow: 0 3px 6px rgba(0,0,0,.4);
  }
  label{
    display:block; font-weight:800; font-size:.82rem; text-transform:uppercase;
    letter-spacing:.06em; color:#5c6b60; margin: 0 0 6px;
  }
  input[type=text]{
    width:100%; font-family:'Nunito',sans-serif; font-size:1rem;
    padding:12px 14px; border:2px solid var(--line); border-radius:8px; background:#fff;
  }
  input[type=text]:focus{ outline:none; border-color: var(--accent); }
  button{
    margin-top:20px; width:100%; padding:14px; font-family:'Nunito',sans-serif;
    font-size:1.05rem; font-weight:800; color:#fff; background: var(--accent);
    border:none; border-radius:10px; cursor:pointer; transition: transform .08s, background .15s;
  }
  button:hover:not(:disabled){ background: var(--accent-dark); }
  button:active:not(:disabled){ transform: scale(.98); }
  button:disabled{ opacity:.55; cursor:not-allowed; }
  button.secondary{ background:#5c6b60; }
  button.secondary:hover{ background:#465049; }

  .qlist{ list-style:none; margin: 18px 0 0; padding:0; }
  .qitem{
    display:flex; align-items:flex-start; gap:12px;
    background:#fff; border:2px solid var(--line); border-radius:10px;
    padding: 14px 16px; margin-bottom:10px; cursor:pointer;
    transition: border-color .12s, background .12s;
  }
  .qitem:hover{ border-color:#d8c9a6; }
  .qitem.selected{ border-color: var(--accent); background:#FFF3EF; }
  .qitem input{ margin-top:3px; width:18px; height:18px; flex-shrink:0; accent-color: var(--accent); }
  .qitem span{ font-weight:600; line-height:1.4; }

  .picked{ text-align:center; font-weight:800; color:#5c6b60; margin-top:14px; font-size:.9rem; }

  .msg{ margin-top:16px; padding:12px 14px; border-radius:8px; font-weight:700; font-size:.92rem; display:none; }
  .msg.ok{ display:block; background:#E4F0E6; color: var(--ok); }
  .msg.error{ display:block; background:#FBE4E1; color: var(--error); }
  .msg.info{ display:block; background:#EFEAD9; color:#5c6b60; }

  .empty{ text-align:center; color:#5c6b60; font-weight:700; padding: 12px 0; }

  /* ---------------------------- confirm modal ---------------------------- */
  /* A small custom dialog, used instead of the browser's built-in confirm()
     so the two buttons can say something more useful than "OK"/"Cancel". */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center;
    padding:16px; z-index:1000;
  }
  .modal-box{
    background: var(--card); border-radius:10px; padding:24px;
    max-width:360px; width:100%; box-shadow:0 18px 40px rgba(0,0,0,.4);
    text-align:center;
  }
  .modal-box p{ font-weight:700; color: var(--ink); margin:0 0 20px; line-height:1.4; }
  .modal-box .modal-buttons{ display:flex; flex-direction:column; gap:10px; }
  .modal-box button{ margin-top:0; } /* override the global button's margin-top:20px */

<script>
/* ============================================================================
 * CONFIG — EDIT THESE TWO LINES ONLY (same values as the other two pages)
 * ==========================================================================*/
const SUPABASE_URL = "https://mpdmxvqaryjvdxrajigy.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wZG14dnFhcnlqdmR4cmFqaWd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NDcyODksImV4cCI6MjEwMTIyMzI4OX0.3ZioZpF0hMMwbyiD30-MZ0PERxbO7U7kFokNWxSI2ko";
/* ==========================================================================*/

const contentEl = document.getElementById('content');
const sublineEl = document.getElementById('subline');
const badgebarEl = document.getElementById('badgebar');

function showLoadError(message) {
  sublineEl.textContent = '';
  contentEl.innerHTML = `<p class="empty">${message}</p>`;
  console.error(message);
}

// Dynamically loads a <script> tag and resolves once it's actually loaded
// (or rejects if it fails), so we can wait for it before doing anything
// that depends on it.
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
}

// The <script> tag in <head> already tried loading the Supabase library
// from jsdelivr. If a network blocks that specific CDN (common on school
// filters), this tries unpkg as a second attempt before giving up.
async function ensureSupabaseLibrary() {
  if (window.supabase) return true;
  try {
    await loadScript('https://unpkg.com/@supabase/supabase-js@2');
  } catch (err) {
    console.error(err);
  }
  return !!window.supabase;
}

(async function main() {
  const loaded = await ensureSupabaseLibrary();
  if (!loaded) {
    showLoadError('Could not load a required script. Check your internet connection and try again.');
    return;
  }

const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ----------------------------------------------------------------------
 * HIDDEN GRADE FILTER
 * The grade never appears anywhere in the visible UI — it comes only from
 * a "grade" parameter in the page URL, e.g.:
 *   https://.../voting.html?grade=3
 * Print a QR code pointing at that URL for each grade and every student
 * who scans it only ever sees their own grade's questions.
 * --------------------------------------------------------------------*/
const params = new URLSearchParams(window.location.search);
const grade = params.get('grade');

// True when this link is the special cross-grade final vote, reached via
// ?grade=FINAL — a fifth link/QR code the teacher hands out only once every
// grade's own voting has ended. Everything below branches on this flag.
let isFinal = false;
let votesAllowed = 1;
let selectedIds = [];

async function init() {
  if (grade === 'FINAL') {
    isFinal = true;
    await initFinal();
    return;
  }

  if (!grade || !['3','4','5','6'].includes(grade)) {
    sublineEl.textContent = '';
    contentEl.innerHTML = '<p class="empty">This link is missing a valid grade. Ask your teacher for the correct QR code or link.</p>';
    return;
  }

  const { data, error } = await dbClient.rpc('fn_get_round_status', { p_grade: grade });
  if (error || !data || data.length === 0) {
    contentEl.innerHTML = '<p class="empty">Could not load voting status. Please try again later.</p>';
    return;
  }

  const status = data[0];
  badgebarEl.innerHTML = `<span class="badge">Grade ${grade}</span>` +
    (status.round_number ? `<span class="badge">Round ${status.round_number}</span>` : '');

  if (status.voting_open === false) {
    sublineEl.textContent = 'Voting has ended for this grade.';
    contentEl.innerHTML = '<p class="empty">Thanks for participating — voting for this grade is closed.</p>';
    return;
  }

  if (!status.round_status || status.round_status !== 'active') {
    sublineEl.textContent = 'No round is open right now.';
    contentEl.innerHTML = '<p class="empty">Check back once your teacher starts the next round.</p>';
    return;
  }

  votesAllowed = status.votes_per_student;
  sublineEl.textContent = `Pick up to ${votesAllowed} question${votesAllowed > 1 ? 's' : ''} you'd like answered.`;

  renderBallotForm();
}

async function initFinal() {
  const { data, error } = await dbClient.rpc('fn_get_final_status');
  const status = (!error && data && data[0]) ? data[0].status : null;

  badgebarEl.innerHTML = `<span class="badge">Final Vote</span>`;
  votesAllowed = 1; // the final round is always a single pick

  if (status === 'active') {
    sublineEl.textContent = "Pick the one question you think should win!";
    renderBallotForm();
  } else if (status === 'ended') {
    sublineEl.textContent = 'The final vote has ended.';
    contentEl.innerHTML = '<p class="empty">Thanks for voting — ask your teacher for the winner!</p>';
  } else {
    sublineEl.textContent = 'The final vote hasn\'t started yet.';
    contentEl.innerHTML = '<p class="empty">Check back once your teacher opens the final vote.</p>';
  }
}

function renderBallotForm() {
  contentEl.innerHTML = `
    <label for="studentId">Your Student ID</label>
    <input type="text" id="studentId" maxlength="30" placeholder="e.g. 123456" autocomplete="off">
    <button id="loadBtn">Show questions</button>
    <div class="msg" id="msg"></div>
  `;
  document.getElementById('loadBtn').addEventListener('click', loadQuestions);
}

async function loadQuestions() {
  const studentId = document.getElementById('studentId').value.trim();
  const msgEl = document.getElementById('msg');
  msgEl.className = 'msg';

  if (!studentId) {
    msgEl.className = 'msg error';
    msgEl.textContent = 'Please enter your Student ID.';
    return;
  }

  const { data: questions, error } = isFinal
    ? await dbClient.rpc('fn_list_final_candidates')
    : await dbClient.rpc('fn_list_open_questions', { p_grade: grade });
  if (error) {
    msgEl.className = 'msg error';
    // Showing the real message (rather than a generic one) so a
    // permissions/schema issue is diagnosable instead of a dead end.
    msgEl.textContent = error.message || 'Could not load questions. Please try again.';
    console.error('fn_list_final_candidates / fn_list_open_questions error:', error);
    return;
  }
  if (!questions || questions.length === 0) {
    contentEl.innerHTML = '<p class="empty">There are no questions to vote on yet.</p>';
    return;
  }

  selectedIds = [];

  const listHtml = questions.map(q => `
    <li class="qitem" data-id="${q.id}">
      <input type="checkbox" data-id="${q.id}">
      <span>${escapeHtml(q.question)}</span>
    </li>
  `).join('');

  contentEl.innerHTML = `
    <p style="font-weight:700; color:#5c6b60; margin:0 0 4px;">Voting as Student ID ${escapeHtml(studentId)}</p>
    <ul class="qlist">${listHtml}</ul>
    <p class="picked" id="pickedCount">0 of ${votesAllowed} selected</p>
    <button id="castBtn">Cast my votes</button>
    <button class="secondary" id="backBtn" type="button">Back</button>
    <div class="msg" id="msg2"></div>
  `;

  document.querySelectorAll('.qitem').forEach(item => {
    item.addEventListener('click', (e) => {
      // avoid double-toggling when the click lands directly on the checkbox
      if (e.target.tagName !== 'INPUT') {
        item.querySelector('input').checked = !item.querySelector('input').checked;
      }
      toggleSelection(item);
    });
  });

  document.getElementById('backBtn').addEventListener('click', renderBallotForm);
  document.getElementById('castBtn').addEventListener('click', () => castVotes(studentId));
}

function toggleSelection(item) {
  const id = Number(item.dataset.id);
  const checkbox = item.querySelector('input');

  if (checkbox.checked) {
    if (selectedIds.length >= votesAllowed) {
      checkbox.checked = false; // block over-selecting
      return;
    }
    selectedIds.push(id);
    item.classList.add('selected');
  } else {
    selectedIds = selectedIds.filter(x => x !== id);
    item.classList.remove('selected');
  }

  document.getElementById('pickedCount').textContent = `${selectedIds.length} of ${votesAllowed} selected`;
}

async function castVotes(studentId) {
  const msgEl = document.getElementById('msg2');
  msgEl.className = 'msg';

  if (selectedIds.length === 0) {
    msgEl.className = 'msg error';
    msgEl.textContent = 'Select at least one question.';
    return;
  }

  // Votes aren't required to be fully used, but a student who only meant
  // to pick 1 of their 3 votes by mistake should get a chance to go back
  // before it's locked in — so confirm rather than submitting silently.
  if (selectedIds.length < votesAllowed) {
    const remaining = votesAllowed - selectedIds.length;
    const proceed = await showConfirmModal(
      `You have ${remaining} vote${remaining === 1 ? '' : 's'} left unused ` +
      `(you picked ${selectedIds.length} of ${votesAllowed}). ` +
      `Submit anyway, or go back and pick more?`,
      'Submit Anyway',
      'Return to Voting'
    );
    if (!proceed) return;
  }

  const castBtn = document.getElementById('castBtn');
  castBtn.disabled = true;
  castBtn.textContent = 'Submitting…';

  const { error } = isFinal
    ? await dbClient.rpc('fn_cast_final_vote', { p_student_id: studentId, p_candidate_id: selectedIds[0] })
    : await dbClient.rpc('fn_cast_votes', { p_grade: grade, p_student_id: studentId, p_question_ids: selectedIds });

  castBtn.disabled = false;
  castBtn.textContent = 'Cast my votes';

  if (error) {
    msgEl.className = 'msg error';
    msgEl.textContent = error.message || 'Something went wrong. Please try again.';
    return;
  }

  contentEl.innerHTML = isFinal
    ? '<p class="empty">Thanks! Your final vote has been recorded.</p>'
    : '<p class="empty">Thanks! Your votes have been recorded for this round.</p>';
}

// Shows a custom confirm dialog with caller-chosen button labels (the
// native confirm() always says "OK"/"Cancel", which isn't clear enough
// here). Resolves true if the confirm button was clicked, false for the
// cancel button.
function showConfirmModal(message, confirmLabel, cancelLabel) {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <p>${escapeHtml(message)}</p>
        <div class="modal-buttons">
          <button id="modalConfirmBtn">${escapeHtml(confirmLabel)}</button>
          <button class="secondary" id="modalCancelBtn" type="button">${escapeHtml(cancelLabel)}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    function close(result) {
      overlay.remove();
      resolve(result);
    }
    document.getElementById('modalConfirmBtn').addEventListener('click', () => close(true));
    document.getElementById('modalCancelBtn').addEventListener('click', () => close(false));
    // Clicking the dimmed backdrop acts the same as the cancel button —
    // the safer of the two outcomes since nothing gets submitted.
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) close(false);
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

init();

})(); // end of main()
</script>
