    font-weight:600;
    font-size: 1.05rem;
    margin:0 0 18px;

    background: var(--gold); color:#4A3200; font-weight:800; font-size:.82rem;
    padding: 6px 14px; border-radius:999px;
  }
  .card{
    background: var(--card);
    border-radius: 8px;
    padding: 28px 24px;
    box-shadow: 0 18px 40px rgba(0,0,0,.35);
    position:relative;
  }
  .pin{
    position:absolute; top:-10px; left:50%; transform: translateX(-50%);
    width:18px; height:18px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #f0d67a, var(--gold));
    box-shadow: 0 3px 6px rgba(0,0,0,.4);

  label{
    display:block; font-weight:800; font-size:.8rem; text-transform:uppercase;
    letter-spacing:.06em; color:#5c6b60; margin: 0 0 6px;

  input[type=text], input[type=password], select{
    width:100%; font-family:'Nunito',sans-serif; font-size:1rem;
    padding:12px 14px; border:2px solid var(--line); border-radius:8px; background:#fff; color: var(--ink);

  input:focus, select:focus{ outline:none; border-color: var(--accent); }
  button{
    margin-top:20px; width:100%; padding:14px; font-family:'Nunito',sans-serif;
    font-size:1.05rem; font-weight:800; color:#fff; background: var(--accent);
    border:none; border-radius:10px; cursor:pointer; transition: transform .08s, background .15s;
  }
  button:hover:not(:disabled){ background: var(--accent-dark); }
  button:active:not(:disabled){ transform: scale(.98); }
  button:disabled{ opacity:.55; cursor:not-allowed; }
  button.secondary{ background:#5c6b60; }
  button.secondary:hover{ background:#465049; }

  .msg{ margin-top:16px; padding:12px 14px; border-radius:8px; font-weight:700; font-size:.92rem; display:none; }
  .msg.ok{ display:block; background:#E4F0E6; color: var(--ok); }
  .msg.error{ display:block; background:#FBE4E1; color: var(--error); }
  .msg.info{ display:block; background:#EFEAD9; color:#5c6b60; }

  .empty{ text-align:center; color:#5c6b60; font-weight:700; padding: 12px 0; }

  .back-link{
    display:block; text-align:center; font-weight:700; font-size:.85rem;
    color:#E7DFC7; text-decoration:none; margin:0 0 14px; opacity:.85;
  }
  .back-link:hover{ opacity:1; text-decoration:underline; }

  /* --------------------------- grade + toolbar --------------------------- */
  .toolbar{ display:flex; align-items:flex-end; gap:12px; margin-bottom:4px; }
  .toolbar > div{ flex:1; }
  .toolbar label{ margin-bottom:6px; }

  /* ------------------------------ question list --------------------------- */
  .qlist{ list-style:none; margin: 18px 0 0; padding:0; }
  .qrow{
    display:flex; align-items:flex-start; gap:14px;
    background:#fff; border:2px solid var(--line); border-radius:10px;
    padding: 14px 16px; margin-bottom:10px;
    transition: border-color .15s, background .15s;
  }
  .qrow.is-excluded{ background:#FBEDEA; border-color:#E9BEB2; }
  .qrow-text{ flex:1; min-width:0; }
  .qrow-student{
    font-weight:800; font-size:.72rem; text-transform:uppercase; letter-spacing:.05em;
    color:#5c6b60; margin:0 0 4px;
  }
  .qrow-question{ font-weight:600; line-height:1.4; margin:0; }
  .qrow-status{
    display:inline-block; margin-top:8px; font-size:.7rem; font-weight:800;
    text-transform:uppercase; letter-spacing:.04em; color: var(--error);
  }

  /* Toggle switch: checked = excluded (hidden from voting), unchecked =
     included (normal/default). Built on a plain checkbox for accessibility
     (keyboard + screen readers) with CSS doing the visual switch styling. */
  .toggle-wrap{ display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0; }
  .toggle-caption{
    font-size:.62rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:#5c6b60;
  }
  .toggle{ position:relative; display:inline-block; width:44px; height:24px; }
  .toggle input{ position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; }
  .toggle-track{
    position:absolute; inset:0; background:#c9c2ae; border-radius:999px;
    transition: background .15s;
  }
  .toggle-thumb{
    position:absolute; top:2px; left:2px; width:20px; height:20px;
    background:#fff; border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.35);
    transition: transform .15s;
  }
  .toggle input:checked ~ .toggle-track{ background: var(--error); }
  .toggle input:checked ~ .toggle-track .toggle-thumb{ transform: translateX(20px); }
  .toggle input:focus-visible ~ .toggle-track{ outline:2px solid var(--accent); outline-offset:2px; }
  .toggle input:disabled{ cursor:not-allowed; }
</style>

<script>

const SUPABASE_URL = "https://mpdmxvqaryjvdxrajigy.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wZG14dnFhcnlqdmR4cmFqaWd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NDcyODksImV4cCI6MjEwMTIyMzI4OX0.3ZioZpF0hMMwbyiD30-MZ0PERxbO7U7kFokNWxSI2ko";

const contentEl  = document.getElementById('content');
const sublineEl  = document.getElementById('subline');
const badgebarEl = document.getElementById('badgebar');

function showLoadError(message) {
  sublineEl.textContent = '';
  contentEl.innerHTML = `<p class="empty">${message}</p>`;
  console.error(message);
}

// Dynamically loads a <script> tag and resolves once it's actually loaded
// (or rejects if it fails) — same helper as the other three pages.
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
}

// Falls back to unpkg if jsdelivr is blocked (school-network guardrail),
// same pattern as admin.html/voting.html/submission.html.
async function ensureSupabaseLibrary() {
  if (window.supabase) return true;
  try {
    await loadScript('https://unpkg.com/@supabase/supabase-js@2');
  } catch (err) {
    console.error(err);
  }
  return !!window.supabase;
}

(async function main() {
  const loaded = await ensureSupabaseLibrary();
  if (!loaded) {
    showLoadError('Could not load a required script. Check your internet connection and try again.');
    return;
  }

  const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Points "Back to Admin" at admin.html in the same folder this page was
  // loaded from, so it still works wherever the site is hosted.
  document.getElementById('backLink').href = getBaseUrl() + 'admin.html';
  function getBaseUrl() {
    return window.location.href.replace(/[^\/]*$/, '');
  }

  /* --------------------------------------------------------------------
   * SESSION — shares the exact same sessionStorage key/shape as
   * admin.html, so navigating here from the admin sidebar in the same
   * browser tab carries the login over automatically. Opening this page
   * in a separate tab (or a browser that clears storage between tabs)
   * will ask for the passphrase again, same as admin.html would.
   * ------------------------------------------------------------------*/
  const ADMIN_SESSION_HOURS = 8;
  const SESSION_KEY = 'qb_admin_session';

  function saveSession(value) {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({
      passphrase: value,
      expiresAt: Date.now() + ADMIN_SESSION_HOURS * 60 * 60 * 1000
    }));
  }
  function loadSession() {
    try {
      const raw = sessionStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed.expiresAt || Date.now() > parsed.expiresAt) {
        sessionStorage.removeItem(SESSION_KEY);
        return null;
      }
      return parsed.passphrase;
    } catch (err) {
      return null;
    }
  }
  function clearSession() {
    sessionStorage.removeItem(SESSION_KEY);
  }

  let passphrase = null;
  let currentGrade = '3';

  async function init() {
    const remembered = loadSession();
    if (remembered) {
      const ok = await tryPassphrase(remembered);
      if (ok) { passphrase = remembered; renderDashboard(); return; }
      clearSession(); // stale/invalid — fall through to the login form
    }
    renderLogin();
  }

  // Same check admin.html uses: fn_get_rounds doubles as a passphrase
  // check, since it's admin-gated and cheap to call with a throwaway grade.
  async function tryPassphrase(value) {
    try {
      const { error } = await dbClient.rpc('fn_get_rounds', { p_passphrase: value, p_grade: '3' });
      return !error;
    } catch (err) {
      console.error('Passphrase check failed:', err);
      return false;
    }
  }

  function renderLogin() {
    sublineEl.textContent = 'Enter the admin passphrase to continue.';
    badgebarEl.innerHTML = '';
    contentEl.innerHTML = `
      <label for="passInput">Admin Passphrase</label>
      <input type="password" id="passInput" autocomplete="off">
      <button id="unlockBtn">Unlock</button>
      <div class="msg" id="loginMsg"></div>
    `;
    const passInput = document.getElementById('passInput');
    passInput.focus();
    passInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptUnlock(); });
    document.getElementById('unlockBtn').addEventListener('click', attemptUnlock);
  }

  async function attemptUnlock() {
    const loginMsg = document.getElementById('loginMsg');
    const value = document.getElementById('passInput').value;
    loginMsg.className = 'msg';

    if (!value) {
      loginMsg.className = 'msg error';
      loginMsg.textContent = 'Enter the passphrase first.';
      return;
    }

    const unlockBtn = document.getElementById('unlockBtn');
    unlockBtn.disabled = true;
    unlockBtn.textContent = 'Checking…';

    const ok = await tryPassphrase(value);

    unlockBtn.disabled = false;
    unlockBtn.textContent = 'Unlock';

    if (!ok) {
      loginMsg.className = 'msg error';
      loginMsg.textContent = 'Incorrect passphrase, or the page could not reach the database.';
      return;
    }

    passphrase = value;
    saveSession(value);
    renderDashboard();
  }

  function renderDashboard() {
    sublineEl.textContent = 'Toggle a question off to hide it from voting.';
    badgebarEl.innerHTML = `<span class="badge">Grade ${currentGrade}</span>`;

    contentEl.innerHTML = `
      <div class="toolbar">
        <div>
          <label for="gradeSelect">Grade</label>
          <select id="gradeSelect">
            <option value="3">Grade 3</option>
            <option value="4">Grade 4</option>
            <option value="5">Grade 5</option>
            <option value="6">Grade 6</option>
          </select>
        </div>
      </div>
      <div class="msg" id="listMsg"></div>
      <div id="listArea"><p class="empty">Loading questions&hellip;</p></div>
    `;

    const gradeSelect = document.getElementById('gradeSelect');
    gradeSelect.value = currentGrade;
    gradeSelect.addEventListener('change', () => {
      currentGrade = gradeSelect.value;
      badgebarEl.innerHTML = `<span class="badge">Grade ${currentGrade}</span>`;
      loadQuestions();
    });

    loadQuestions();
  }

  async function loadQuestions() {
    const listArea = document.getElementById('listArea');
    const listMsg  = document.getElementById('listMsg');
    listMsg.className = 'msg';
    listArea.innerHTML = '<p class="empty">Loading questions&hellip;</p>';

    const { data, error } = await dbClient.rpc('fn_list_questions_for_grade', {
      p_passphrase: passphrase,
      p_grade: currentGrade
    });

    if (error) {
      listMsg.className = 'msg error';
      listMsg.textContent = error.message || 'Could not load questions.';
      listArea.innerHTML = '';
      console.error('fn_list_questions_for_grade error:', error);
      return;
    }

    if (!data || data.length === 0) {
      listArea.innerHTML = '<p class="empty">No questions submitted for this grade yet.</p>';
      return;
    }

    listArea.innerHTML = `<ul class="qlist">${data.map(rowHtml).join('')}</ul>`;

    listArea.querySelectorAll('.toggle input').forEach(input => {
      input.addEventListener('change', () => setExcluded(input));
    });
  }

  function rowHtml(q) {
    return `
      <li class="qrow ${q.excluded ? 'is-excluded' : ''}" data-id="${q.id}">
        <div class="qrow-text">
          <p class="qrow-student">Student ${escapeHtml(q.student_id)}</p>
          <p class="qrow-question">${escapeHtml(q.question)}</p>
          ${q.excluded ? '<span class="qrow-status">Excluded — hidden from voting</span>' : ''}
        </div>
        <div class="toggle-wrap">
          <span class="toggle-caption">Exclude</span>
          <label class="toggle">
            <input type="checkbox" data-id="${q.id}" ${q.excluded ? 'checked' : ''}>
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>
      </li>
    `;
  }

  async function setExcluded(input) {
    const id = Number(input.dataset.id);
    const nextExcluded = input.checked;
    const row = input.closest('.qrow');
    const listMsg = document.getElementById('listMsg');
    listMsg.className = 'msg';

    input.disabled = true;

    const { error } = await dbClient.rpc('fn_set_question_excluded', {
      p_passphrase: passphrase,
      p_question_id: id,
      p_excluded: nextExcluded
    });

    input.disabled = false;

    if (error) {
      // Revert the toggle visually since the database didn't accept it.
      input.checked = !nextExcluded;
      listMsg.className = 'msg error';
      listMsg.textContent = error.message || 'Could not update this question. Please try again.';
      console.error('fn_set_question_excluded error:', error);
      return;
    }

    row.classList.toggle('is-excluded', nextExcluded);
    let statusEl = row.querySelector('.qrow-status');
    if (nextExcluded && !statusEl) {
      statusEl = document.createElement('span');
      statusEl.className = 'qrow-status';
      statusEl.textContent = 'Excluded — hidden from voting';
      row.querySelector('.qrow-text').appendChild(statusEl);
    } else if (!nextExcluded && statusEl) {
      statusEl.remove();
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  init();

})(); // end of main()
</script>

</body>
</html>
